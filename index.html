/* ═══ Profile Extraction ═══ */
function extractProfile(t){
  const lo=t.toLowerCase();
  const unis=["清华","北大","北京大学","复旦","上海交通","浙大","浙江大学","南大","中科大","哈工大","西安交大","武大","华中科技","中山大学","同济","北航","北理工","天大","东南大学","华南理工","电子科技","北邮","人民大学","厦门大学","四川大学","山东大学","吉林大学","中南大学","大连理工","重庆大学","湖南大学"];
  let edu="";unis.forEach(u=>{if(t.includes(u))edu=t.match(new RegExp(u+"[大学工业科技术]*"))?.[0]||u;});
  if(!edu){const m=t.match(/[\u4e00-\u9fa5]{2,8}(?:大学|学院|理工|科技)/);if(m)edu=m[0];}
  let deg="本科";if(/博士|phd/i.test(lo))deg="博士";else if(/硕士|研究生|master/i.test(lo))deg="硕士";
  const majors=["计算机","软件工程","人工智能","数据科学","统计学","数学","电子信息","通信工程","自动化","金融","经济学","市场营销","新闻传播","广告学","设计","信息管理","工商管理","会计","心理学"];
  let major="";majors.forEach(m=>{if(t.includes(m))major=m;});
  const allSkills=["Python","Java","C++","JavaScript","TypeScript","React","Vue","Node.js","Go","Rust","SQL","MySQL","Redis","MongoDB","HTML","CSS","Spring Boot","Django","Flask","PyTorch","TensorFlow","Pandas","NumPy","Docker","Git","Linux","Figma","Axure","Sketch","PS","Photoshop","PR","剪辑","Tableau","PowerBI","Excel","SPSS","R","Matlab","Hive","Spark","Hadoop","Flink","Kafka","NLP","CV","深度学习","机器学习","数据分析","数据挖掘","前端","后端","全栈","产品设计","用户研究","项目管理","内容运营","活动策划","文案","Unity","Unreal","游戏设计","数值策划","特征工程","风控","小红书","抖音","新媒体"];
  const skills=allSkills.filter(s=>lo.includes(s.toLowerCase()));
  const roleKw={"产品":["产品","PM","产品经理"],"前端":["前端","React","Vue","H5"],"后端":["后端","Java","Go","Spring","服务端"],"数据分析":["数据分析","分析师","BI","数据"],"AI算法":["AI","算法","深度学习","机器学习","NLP","CV","大模型"],"运营":["运营","新媒体","内容","营销"],"游戏策划":["游戏","游戏策划","关卡"],"风控算法":["风控","反欺诈"]};
  let targetRole="",maxHit=0;Object.entries(roleKw).forEach(([r,ks])=>{const h=ks.filter(k=>lo.includes(k.toLowerCase())).length;if(h>maxHit){maxHit=h;targetRole=r;}});
  if(!targetRole&&skills.length)targetRole=skills.includes("React")||skills.includes("Vue")?"前端":skills.includes("Java")?"后端":"数据分析";
  const cities=["北京","上海","深圳","杭州","广州","成都","南京","武汉","西安","长沙"];
  let city="";cities.forEach(c=>{if(t.includes(c))city=city?city+"、"+c:c;});

}

/* ═══ Parse pasted JD ═══ */
function parseJD(text){
  const lo=text.toLowerCase();
  let company="",title="";
  const cm=text.match(/(?:公司|企业|集团)[：:]\s*([\u4e00-\u9fa5A-Za-z]{2,20})/);if(cm)company=cm[1];
  if(!company){const known=["腾讯","字节跳动","阿里巴巴","美团","华为","小红书","网易","蚂蚁","百度","京东","拼多多","快手","B站","bilibili","滴滴","携程","vivo","oppo","OPPO","VIVO","小米","蔚来","理想","比亚迪"];known.forEach(k=>{if(text.includes(k))company=k;});}
  const tm=text.match(/(?:岗位|职位|招聘)[：:]\s*([^\n，。]{3,30})/);if(tm)title=tm[1].trim();
  if(!title){const tp=text.match(/([\u4e00-\u9fa5]{2,6}(?:工程师|经理|分析师|策划|运营|设计师|开发|算法|研究员)(?:（?实习）?)?)/);if(tp)title=tp[1];}
  const allSkills=["Python","Java","C++","JavaScript","TypeScript","React","Vue","Node.js","Go","SQL","MySQL","Redis","HTML","CSS","Spring Boot","PyTorch","TensorFlow","Docker","Git","Linux","Figma","Axure","PS","Tableau","PowerBI","Excel","Hive","Spark","NLP","CV","深度学习","机器学习","数据分析","Unity","Unreal"];
  const skills=allSkills.filter(s=>lo.includes(s.toLowerCase()));
  const cities=["北京","上海","深圳","杭州","广州","成都","南京","武汉","西安"];
  let loc="";cities.forEach(c=>{if(text.includes(c)&&!loc)loc=c;});
  return{id:100+Math.floor(Math.random()*900),company:company||"目标公司",title:title||"目标岗位",location:loc||"未知",salary:"面议",source:"custom",sourceName:"自定义JD",tags:skills.slice(0,4),requirements:text.slice(0,200),description:text.slice(0,150),industry:"",education:"",hard_skills:skills,soft_skills:[],keywords:skills.concat(title?[title]:[])};
}

/* ═══ Matching ═══ */
function matchJobs(profile,jobList){
  const pt=(profile.skills.join(" ")+" "+profile.targetRole+" "+profile.major+" "+profile.experience).toLowerCase();
  return jobList.map(job=>{
    let score=30;
    job.keywords.forEach(k=>{if(pt.includes(k.toLowerCase()))score+=8;});
    job.hard_skills.forEach(s=>{if(profile.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()))score+=6;});
    job.tags.forEach(t=>{if(pt.includes(t.toLowerCase()))score+=5;});
    if(job.keywords.some(k=>profile.targetRole.toLowerCase().includes(k.toLowerCase())))score+=10;
    if(profile.city&&profile.city!=="不限"&&profile.city.includes(job.location))score+=5;
    if(profile.degree==="硕士"||profile.degree==="博士")score+=3;
    score=Math.min(score,96);
    const ms=job.hard_skills.filter(s=>profile.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()));
    const mg=job.hard_skills.filter(s=>!profile.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()));
    const strengths=[];if(ms.length)strengths.push("掌握："+ms.slice(0,3).join("、"));if(profile.experience)strengths.push("有相关经历");if(!strengths.length)strengths.push("发展潜力");
    const gaps=[];if(mg.length)gaps.push("建议补充："+mg.slice(0,2).join("、"));if(!gaps.length)gaps.push("可深化技术栈");
    return{jobId:job.id,job,score,reason:score>=75?`与${job.title}高度匹配，${ms.length}项核心技能对应`:score>=55?`方向吻合，部分技能匹配`:`有基础，需补强相关技能`,strengths,gaps};
  }).sort((a,b)=>b.score-a.score).slice(0,6);
}
function analyzeGaps(p,j){
  const ps=p.skills.map(s=>s.toLowerCase());const gi=[];
  j.hard_skills.forEach(s=>{if(!ps.includes(s.toLowerCase()))gi.push({skill:s,severity:j.tags.map(t=>t.toLowerCase()).includes(s.toLowerCase())?"high":"medium",description:`${j.title}要求${s}，简历未体现`,suggestion:`建议通过项目实战学习${s}`});});
  j.soft_skills.forEach(s=>gi.push({skill:s,severity:"low",description:`${s}是重要软技能`,suggestion:`在项目经历中体现${s}`}));
  return{gaps:gi.slice(0,6),overallReadiness:gi.filter(g=>g.severity==="high").length===0?"核心技能基本覆盖，建议深化项目经验":"存在核心技能缺口，建议优先补强",keyActions:[`重点准备${j.tags.slice(0,2).join("和")}相关知识`,`简历中量化项目成果`,`了解${j.company}的核心业务`]};
}
function generateQA(p,j){
  const qs=[{question:"请做一个简短的自我介绍",category:"行为面试",answer:`我是${p.education}${p.major}${p.degree}生，掌握${p.skills.slice(0,3).join("、")}等技能，${p.experience?"曾"+p.experience.slice(0,40):"积极参与项目实践"}，对${j.title}方向充满热情。`,key_points:["突出匹配技能","量化成果","表达热情"]},
  {question:"为什么选择这个岗位？",category:"行为面试",answer:`${j.company}在${j.industry}领域的影响力和技术实力让我向往，${j.title}所需的${j.tags.slice(0,2).join("、")}与我的方向高度吻合。`,key_points:["展示对公司了解","说明匹配度"]},
  {question:"描述一个你遇到的技术挑战",category:"行为面试",answer:"用STAR法则：情境→任务→行动→结果。重点突出问题解决能力。",key_points:["STAR法则","体现成长"]}];
  j.hard_skills.slice(0,2).forEach(s=>qs.push({question:`介绍你对${s}的理解和使用经验`,category:"技术面试",answer:`涵盖核心概念、项目中如何使用、遇到的难点及方案。`,key_points:[`展示${s}深度`,`结合项目`]}));
  qs.push({question:`${j.tags[0]}项目出现严重bug即将上线怎么办？`,category:"情景面试",answer:"评估影响→同步负责人→快速修复或降级→事后复盘。",key_points:["冷静分析","团队协作","复盘思维"]});
  qs.push({question:"未来3年的职业规划？",category:"行为面试",answer:`1年：深入${j.tags[0]}领域；2-3年：主导核心项目，建立专业壁垒。`,key_points:["清晰目标","与公司对齐"]});
  return qs;
}
function generateResume(p,j){

/* ═══ Score Ring ═══ */
function SR({s,sz=52}){const r=(sz-8)/2,c=2*Math.PI*r,p=s/100,cl=s>=80?"#2f7d5f":s>=60?"#9a6a1f":"#b3261e";
return <div className="sr" style={{width:sz,height:sz}}><svg width={sz} height={sz}><circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke="#f0f1f5" strokeWidth="5"/><circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={cl} strokeWidth="5" strokeDasharray={c} strokeDashoffset={c*(1-p)} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s"}}/></svg><span className="sn" style={{color:cl}}>{s}</span></div>;}

/* ═══ QA Card ═══ */
function QC({qa,i}){const[o,setO]=useState(false);const cs={"行为面试":"#1a73e8","技术面试":"#b3261e","情景面试":"#9a6a1f"};

          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button style={{padding:"6px 14px",borderRadius:999,border:"1px solid var(--border)",background:"#fff",color:"var(--primary)",fontSize:12,fontWeight:600}} onClick={()=>setShowJD(true)}>+ 添加 JD</button>
            {customJDs.length>0&&<span className="ht" style={{alignSelf:"center"}}>已添加 {customJDs.length} 个自定义岗位</span>}
          </div>
        </div>
      </div>

      {/* ═══ Results ═══ */}
      <div className={`pn rp ${pn!=="result"?"mh":""}`}>
        <div className="tb">{tabs.map(t=><button key={t.k} className={`tt ${tab===t.k?"on":""}`} onClick={()=>setTab(t.k)}>{t.l}{t.b?<span className="tg">{t.b}</span>:null}</button>)}</div>
        <div className="tc">

          {tab==="intro"&&<div className="fade-in" style={{maxWidth:680,animation:"fadeIn .24s ease"}}>
            <div style={{textAlign:"center",padding:"32px 20px"}}><div style={{fontSize:44,marginBottom:12}}>🎯</div>
            <h2 style={{fontSize:20,fontWeight:800,marginBottom:8}}>Offer 捕手 · AI 求职匹配智能体</h2>
            <p className="ht" style={{maxWidth:500,margin:"0 auto"}}>多智能体架构，覆盖 画像提取→岗位匹配→缺口分析→简历生成→面试准备 全流程</p>
            <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:14,flexWrap:"wrap"}}>
              <span className="src-tag src-boss">Boss直聘</span><span className="src-tag src-shixi">实习僧</span>
              <span className="src-tag src-liepin">猎聘</span><span className="src-tag src-guanwang">企业官网</span>
              <span className="src-tag src-lagou">拉勾</span><span className="src-tag src-zhilian">智联招聘</span>
            </div></div>
            <div className="fg3">{[["🤖","多 Agent 协同","6大Agent全流程"],["🌐","多渠道岗位","Boss直聘/实习僧/猎聘/官网"],["📋","自定义 JD","粘贴任意岗位描述"],["📊","缺口分析","识别能力差距"],["📄","定制简历","自动HTML简历"],["🎤","面试题库","针对性面试题"]].map(([i,t,d])=><div key={t} className="fc"><div style={{fontSize:22,marginBottom:4}}>{i}</div><div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{t}</div><div className="ht" style={{fontSize:11}}>{d}</div></div>)}</div>
            {profile&&<div className="cd" style={{marginTop:16}}><h4 style={{fontSize:14,fontWeight:700,marginBottom:8}}>📋 候选人画像</h4><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,fontSize:13}}><div><span style={{color:"var(--text-secondary)"}}>学校：</span>{profile.education}</div><div><span style={{color:"var(--text-secondary)"}}>学历：</span>{profile.degree}</div><div><span style={{color:"var(--text-secondary)"}}>专业：</span>{profile.major}</div><div><span style={{color:"var(--text-secondary)"}}>目标：</span>{profile.targetRole}</div><div style={{gridColumn:"1/-1"}}><span style={{color:"var(--text-secondary)"}}>技能：</span><span className="tg2">{(profile.skills||[]).map(s=><span key={s} className="t">{s}</span>)}</span></div></div></div>}
          </div>}

          {tab==="job"&&<div style={{maxWidth:720,animation:"fadeIn .24s ease"}}>
            {!matches?<div className="et" style={{padding:80}}><div style={{fontSize:32}}>📋</div><p>尚未匹配</p><p className="ht">在左侧输入求职信息</p></div>:
            <div>{matches.map((m,i)=>{const j=m.job;return <div key={j.id} className="cd">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}><span className="rb">TOP {i+1}</span><h3 style={{fontSize:15,fontWeight:700,margin:0}}>{j.title}</h3><SrcTag job={j}/></div><div style={{fontSize:13,color:"#1a73e8",fontWeight:600}}>{j.company}</div></div>
                <SR s={m.score}/>
              </div>
              <div className="mr"><span>📍 {j.location}</span><span>💰 {j.salary}</span><span>🎓 {j.education||"本科+"}</span></div>
              <div style={{marginBottom:8}}><div className="sl">技能要求</div><div className="tg2">{j.hard_skills.slice(0,6).map(s=><span key={s} className={`t ${profile?.skills?.map(x=>x.toLowerCase()).includes(s.toLowerCase())?"s":""}`}>{s}{profile?.skills?.map(x=>x.toLowerCase()).includes(s.toLowerCase())?" ✓":""}</span>)}</div></div>
              <div style={{fontSize:13,lineHeight:1.7,marginBottom:8}}><strong>分析：</strong>{m.reason}</div>
              <div style={{display:"flex",gap:16}}><div style={{flex:1}}><div className="sl" style={{color:"#2f7d5f"}}>✅ 优势</div>{m.strengths.map((s,k)=><div key={k} className="ht" style={{fontSize:12}}>• {s}</div>)}</div>
              <div style={{flex:1}}><div className="sl" style={{color:"#b3261e"}}>⚠️ 待提升</div>{m.gaps.map((g,k)=><div key={k} className="ht" style={{fontSize:12}}>• {g}</div>)}</div></div>
            </div>})}</div>}
          </div>}

          {tab==="resume"&&<div style={{maxWidth:720,animation:"fadeIn .24s ease"}}>
            {!resume?<div className="et" style={{padding:80}}><div style={{fontSize:32}}>📄</div><p>简历尚未生成</p></div>:
            <div><div style={{marginBottom:10}}><button style={{padding:"6px 12px",borderRadius:999,border:"1px solid var(--border)",background:"#fff",fontSize:12,color:"var(--primary)",fontWeight:600}} onClick={()=>{const b=new Blob([resume],{type:"text/html"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="resume.html";a.click();}}>导出 HTML</button></div>
            <div className="cd" style={{padding:0,overflow:"hidden"}}><iframe srcDoc={resume} style={{width:"100%",height:600,border:"none"}} title="r"/></div></div>}
          </div>}

          {tab==="gaps"&&<div style={{maxWidth:720,animation:"fadeIn .24s ease"}}>
            {!gaps?<div className="et" style={{padding:80}}><div style={{fontSize:32}}>📊</div><p>尚未分析</p></div>:
            <div>{gaps.overallReadiness&&<div className="cd hl"><div style={{fontSize:13,fontWeight:700,marginBottom:4}}>🎯 整体准备度</div><div style={{fontSize:14,lineHeight:1.7}}>{gaps.overallReadiness}</div></div>}
            {gaps.gaps.map((g,i)=>{const s=sv(g.severity);return <div key={i} className="cd"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontWeight:600}}>{g.skill}</span><span style={{fontSize:11,padding:"2px 10px",borderRadius:999,background:s.bg,color:s.c,fontWeight:600}}>{s.t}</span></div><p className="ht" style={{marginBottom:4}}>{g.description}</p>{g.suggestion&&<p style={{fontSize:12,color:"#1a73e8"}}>💡 {g.suggestion}</p>}</div>})}
            {gaps.keyActions?.length>0&&<div className="cd"><h4 style={{fontSize:14,fontWeight:700,marginBottom:8}}>🚀 行动建议</h4>{gaps.keyActions.map((a,i)=><div key={i} style={{fontSize:13,lineHeight:1.8,paddingLeft:20,position:"relative"}}><span style={{position:"absolute",left:0,color:"#1a73e8",fontWeight:700}}>{i+1}.</span>{a}</div>)}</div>}
            </div>}
          </div>}

          {tab==="interview"&&<div style={{maxWidth:720,animation:"fadeIn .24s ease"}}>
            {!qa?.length?<div className="et" style={{padding:80}}><div style={{fontSize:32}}>🎤</div><p>尚未生成</p></div>:
            <div><div className="ht" style={{marginBottom:10}}>共 {qa.length} 道面试题</div>{qa.map((q,i)=><QC key={i} qa={q} i={i}/>)}</div>}
          </div>}

          {tab==="debug"&&<div style={{maxWidth:720,animation:"fadeIn .24s ease"}}>
            <div className="cd"><h4 style={{fontSize:14,fontWeight:700,marginBottom:10}}>🔧 已触发 Agents</h4>
            {agents.length===0?<p className="ht">暂无</p>:agents.map((a,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 0",borderBottom:i<agents.length-1?"1px solid var(--border)":"none"}}><span style={{width:6,height:6,borderRadius:"50%",background:"#1a73e8"}}/><span style={{fontSize:13,fontWeight:600}}>{a.name}</span><span style={{fontSize:11,color:"var(--text-light)",marginLeft:"auto"}}>{a.time}</span></div>)}</div>
            <div className="cd"><h4 style={{fontSize:14,fontWeight:700,marginBottom:6}}>📦 State</h4><pre style={{fontSize:12,background:"#f8fbff",padding:10,borderRadius:8,overflow:"auto",maxHeight:300,lineHeight:1.5}}>{JSON.stringify({apiKeySet:!!apiKey,profile:profile?{...profile,skills:profile.skills?.length+"项"}:null,matchCount:matches?.length,customJDs:customJDs.length,gapCount:gaps?.gaps?.length,qaCount:qa?.length,hasResume:!!resume},null,2)}</pre></div>
          </div>}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
