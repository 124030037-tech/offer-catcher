html,body,#root{height:100%;overflow:hidden}
button{cursor:pointer;border:none;font:inherit;outline:none;color:inherit}
textarea{font:inherit;outline:none}

}
.pane{flex:0 0 50%;width:50%;height:100%;display:flex;flex-direction:column;overflow:hidden}
.chat-pane{border-right:1px solid var(--border);box-shadow:8px 0 24px rgba(39,83,138,.05);z-index:1;background:var(--bg-white)}

.score-ring{position:relative;display:inline-flex;align-items:center;justify-content:center}

.dim-bar{height:6px;border-radius:3px;background:#f0f1f5;overflow:hidden;flex:1}
.dim-fill{height:100%;border-radius:3px;transition:width 1s ease}
</style>
</head>

  const skills=allSkills.filter(s=>t.includes(s.toLowerCase()));
  // Interests & Target
  const roleKw={"产品":["产品","PM","产品经理","产品设计"],"前端":["前端","前端开发","Web","React","Vue","H5"],"后端":["后端","后端开发","服务端","Java","Go","Spring"],"数据分析":["数据分析","分析师","BI","数据"],"AI算法":["AI","算法","深度学习","机器学习","NLP","CV","大模型"],"运营":["运营","新媒体","内容","营销","活动策划"],"游戏策划":["游戏","游戏策划","关卡","数值"],"风控算法":["风控","反欺诈","金融科技"]};
  let targetRole="";let maxHit=0;
  Object.entries(roleKw).forEach(([role,kws])=>{const hit=kws.filter(k=>t.includes(k.toLowerCase())).length;if(hit>maxHit){maxHit=hit;targetRole=role;}});
  if(!targetRole&&skills.length>0) targetRole = skills.includes("React")||skills.includes("Vue")?"前端":skills.includes("Java")||skills.includes("Go")?"后端":skills.includes("Python")?"数据分析":"产品";
  // City
  const cities=["北京","上海","深圳","杭州","广州","成都","南京","武汉","西安","长沙","重庆","苏州","天津","厦门","青岛","大连","合肥","郑州"];
  let city="";cities.forEach(c=>{if(text.includes(c)){city=city?city+"、"+c:c;}});
  // Experience
  let exp="";const expMatch=text.match(/(?:实习|项目|经[历验]|做过|参与|负责|开发了|设计了)[^，。；\n]{4,60}/g);
  if(expMatch)exp=expMatch.join("；");
  // Name (optional)
  let name="";const nameMatch=text.match(/(?:我(?:叫|是|的名字[是叫]))\s*([\u4e00-\u9fa5]{2,4})/);
  if(nameMatch)name=nameMatch[1];
  return{name:name||"同学",education:edu||"未指定",degree:deg,major:major||"未指定",skills,experience:exp,interests:targetRole+"方向",targetRole:targetRole||"未指定",city:city||"不限",summary:`${edu||"高校"}${major||""}${deg}，目标${targetRole||"互联网"}方向`};
}

/* ════ Matching Engine ════ */
function matchJobs(profile){
  const pText=(profile.skills.join(" ")+" "+profile.targetRole+" "+profile.interests+" "+profile.major+" "+profile.experience).toLowerCase();
  return JOBS.map(job=>{
    let score=30;
    // Keyword match
    job.keywords.forEach(k=>{if(pText.includes(k.toLowerCase()))score+=8;});
    job.hard_skills.forEach(s=>{if(profile.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()))score+=6;});
    job.tags.forEach(t=>{if(pText.includes(t.toLowerCase()))score+=5;});
    // Role match
    if(pText.includes(job.title.replace(/（.*）/,"").toLowerCase()))score+=12;
    if(job.keywords.some(k=>profile.targetRole.toLowerCase().includes(k.toLowerCase())))score+=10;
    // City match
    if(profile.city&&profile.city!=="不限"&&profile.city.includes(job.location))score+=5;
    // Education
    if(profile.degree==="硕士"||profile.degree==="博士")score+=3;
    // Cap
    score=Math.min(score,96);
    // Generate analysis
    const strengths=[];const gaps=[];
    const matchedSkills=job.hard_skills.filter(s=>profile.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()));
    const missingSkills=job.hard_skills.filter(s=>!profile.skills.map(x=>x.toLowerCase()).includes(s.toLowerCase()));
    if(matchedSkills.length>0)strengths.push(`掌握核心技能：${matchedSkills.slice(0,3).join("、")}`);
    if(profile.degree==="硕士"||profile.degree==="博士")strengths.push("学历优势明显");
    if(profile.experience)strengths.push("具备相关实践经历");
    if(profile.city.includes(job.location))strengths.push(`意向城市匹配（${job.location}）`);
    if(strengths.length===0)strengths.push("学习能力和发展潜力");
    if(missingSkills.length>0)gaps.push(`建议补充：${missingSkills.slice(0,2).join("、")}`);
    if(!profile.experience)gaps.push("建议积累更多实习/项目经验");
    if(gaps.length===0)gaps.push("可进一步深化技术栈深度");
    const reason=score>=75?`技能背景与${job.title}高度契合，${matchedSkills.length}项核心技能直接匹配`:score>=55?`专业方向与${job.title}基本吻合，部分技能匹配`:`有一定基础，建议补强与${job.title}相关技能`;
    return{jobId:job.id,job,score,reason,strengths,gaps};
  }).sort((a,b)=>b.score-a.score).slice(0,5);
}

/* ════ Gap Analysis ════ */
function analyzeGaps(profile,job){
  const pSkills=profile.skills.map(s=>s.toLowerCase());
  const gapItems=[];
  job.hard_skills.forEach(s=>{
    if(!pSkills.includes(s.toLowerCase())){
      const sev=job.tags.map(t=>t.toLowerCase()).includes(s.toLowerCase())?"high":"medium";
      gapItems.push({skill:s,severity:sev,description:`${job.title}要求掌握${s}，目前简历中未体现该技能`,suggestion:sev==="high"?`建议通过项目实战或在线课程系统学习${s}，这是该岗位的核心要求`:`可通过教程或小项目了解${s}的基本使用`});
    }
  });
  job.soft_skills.forEach(s=>{
    gapItems.push({skill:s,severity:"low",description:`${s}是该岗位重要的软技能要求`,suggestion:`可在简历的项目经历中体现${s}相关表现`});
  });
  const readiness=gapItems.filter(g=>g.severity==="high").length;
  return{
    gaps:gapItems.slice(0,6),
    overallReadiness:readiness===0?`整体准备度良好，核心技能基本覆盖，建议在项目深度上进一步提升。`:readiness<=2?`存在${readiness}项核心技能缺口，建议优先补强后再投递，可通过1-2个月的项目实战来填补。`:`存在较多核心技能缺口，建议制定3个月学习计划，分阶段提升。`,
    keyActions:[`针对${job.company}${job.title}岗位，重点准备${job.tags.slice(0,2).join("和")}相关知识`,`在简历中量化项目成果，使用数据说明影响力（如提升XX%、服务XX用户）`,`了解${job.company}的核心业务和产品，准备"为什么选择我们"的回答`]
  };
}

/* ════ Interview QA Generator ════ */
function generateQA(profile,job){
  const qs=[];
  // Behavioral
  qs.push({question:"请做一个简短的自我介绍。",category:"行为面试",answer:`我是${profile.education}${profile.major}专业${profile.degree}生，对${profile.targetRole}方向充满热情。在校期间系统学习了${profile.skills.slice(0,3).join("、")}等技能，${profile.experience?"并且"+profile.experience.slice(0,50):"同时积极参与相关项目实践"}。我认为我的专业背景和实践经验与${job.company}${job.title}岗位高度匹配。`,key_points:["突出与岗位匹配的技能","量化成果","表达对公司的了解和热情"]});
  qs.push({question:"你为什么选择应聘这个岗位？",category:"行为面试",answer:`我对${job.industry}行业有浓厚兴趣，${job.company}在该领域的技术实力和产品影响力让我非常向往。${job.title}岗位所要求的${job.tags.slice(0,2).join("、")}等能力与我的专业方向高度吻合。我希望能在这个平台上将所学知识应用到实际产品中，同时不断成长。`,key_points:["展示对公司的了解","说明岗位与自身匹配度","表达成长意愿"]});
  qs.push({question:"描述一个你遇到的最大挑战，你是如何克服的？",category:"行为面试",answer:"可以用 STAR 法则回答：描述当时的情境（Situation）、你的任务（Task）、采取的行动（Action）和最终结果（Result）。重点突出你的问题解决能力和学习能力。",key_points:["使用STAR法则结构化回答","体现问题解决能力","展示成长和反思"]});
  // Technical
  job.hard_skills.slice(0,2).forEach(s=>{
    qs.push({question:`请介绍一下你对${s}的理解和使用经验。`,category:"技术面试",answer:`回答时应涵盖：1）对${s}核心概念的理解；2）在项目中如何使用${s}解决实际问题；3）遇到的技术难点和解决方案。如果有量化的成果更好。`,key_points:[`展示对${s}的深入理解`,`结合具体项目说明`,`体现解决问题的能力`]});
  });
  // Situational
  qs.push({question:`如果你负责的${job.tags[0]}项目出现了严重 bug 即将上线，你会怎么处理？`,category:"情景面试",answer:"首先评估 bug 的影响范围和严重程度，立即同步给团队负责人。如果可以快速修复则优先修复并充分测试；如果修复时间较长，考虑是否可以降级处理或延迟上线。事后进行复盘，建立相应的预防机制。",key_points:["展示冷静分析能力","体现团队协作意识","包含事后复盘思维"]});
  qs.push({question:"你对自己未来3年的职业规划是什么？",category:"行为面试",answer:`短期（1年）：在${job.company}深入学习${job.tags[0]}领域的专业知识，快速成长为能独立负责模块的成员。中期（2-3年）：能够主导核心项目，在${profile.targetRole}领域建立自己的专业壁垒，同时拓展业务理解力。`,key_points:["展示清晰的职业目标","与公司发展方向对齐","体现成长野心"]});
  return qs;
}

/* ════ Score Ring ════ */
function ScoreRing({score,size=56}){
  const r=(size-8)/2,c=2*Math.PI*r,pct=score/100;
  const clr=score>=80?"#2f7d5f":score>=60?"#9a6a1f":"#b3261e";
  return(<div className="score-ring" style={{width:size,height:size}}>
    <svg width={size} height={size}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#f0f1f5" strokeWidth="5"/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={clr} strokeWidth="5" strokeDasharray={c} strokeDashoffset={c*(1-pct)} strokeLinecap="round" style={{transition:"stroke-dashoffset 1s ease"}}/></svg>
    <span className="score-num" style={{color:clr}}>{score}</span>
  </div>);
}

        <div className="input-area"><div className="input-row">
          <textarea ref={taRef} value={input} onChange={e=>setInput(e.target.value)} rows={1} placeholder="输入背景信息... (Enter 发送)" onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";}}/>
          <button className="send-btn" onClick={send} disabled={loading}>{loading?"处理中":"发送"}</button>
        </div></div>
      </div>

      {/* Results */}
      <div className={`pane result-pane ${panel!=="result"?"m-hide":""}`}>
        <div className="tab-bar">{tabList.map(t=><button key={t.key} className={`tab-btn ${tab===t.key?"active":""}`} onClick={()=>setTab(t.key)}>{t.label}{t.badge?<span className="tab-badge">{t.badge}</span>:null}</button>)}</div>
        <div className="tab-body">

          {tab==="intro"&&<div className="fade-in" style={{maxWidth:680}}>
            <div style={{textAlign:"center",padding:"40px 20px"}}><div style={{fontSize:48,marginBottom:16}}>🎯</div>
              <h2 style={{fontSize:20,fontWeight:800,marginBottom:8}}>Offer 捕手 · AI 求职匹配智能体</h2>
              <p className="hint" style={{maxWidth:500,margin:"0 auto",lineHeight:1.7}}>基于多智能体架构，覆盖 画像提取→岗位匹配→缺口分析→简历生成→面试准备 全流程</p></div>
            <div className="feat-grid">
              {[["🤖","多 Agent 协同","Planner/Profile/Matching/Gap/Interview/Resume 六大 Agent"],["🎯","NLP 精准匹配","多维画像分析与加权评分算法"],["📊","能力缺口分析","识别候选人与岗位能力差距"],["📄","定制简历生成","针对目标岗位自动生成 HTML 简历"],["🎤","面试题库","基于岗位和简历生成面试题"],["💬","多轮对话","持续补充信息，增量更新结果"]].map(([i,t,d])=><div key={t} className="feat-card"><div style={{fontSize:24,marginBottom:6}}>{i}</div><div style={{fontSize:13,fontWeight:700,marginBottom:3}}>{t}</div><div className="hint" style={{fontSize:12}}>{d}</div></div>)}
            </div>
            {profile&&<div className="card" style={{marginTop:20}}><h4 style={{fontSize:14,fontWeight:700,marginBottom:10}}>📋 候选人画像</h4><div className="profile-grid"><div><span className="label">学校：</span>{profile.education}</div><div><span className="label">学历：</span>{profile.degree}</div><div><span className="label">专业：</span>{profile.major}</div><div><span className="label">目标：</span>{profile.targetRole}</div><div style={{gridColumn:"1/-1"}}><span className="label">技能：</span><span className="tag-row">{(profile.skills||[]).map(s=><span key={s} className="tag">{s}</span>)}</span></div></div></div>}
          </div>}

          {tab==="job"&&<div className="fade-in" style={{maxWidth:720}}>
            {!matches?<div className="empty-panel"><div style={{fontSize:32}}>📋</div><p>尚未匹配岗位</p><p className="hint">在左侧输入求职信息</p></div>:
            <div className="grid-gap"><div className="hint">共匹配 {matches.length} 个岗位</div>
              {matches.map((m,i)=>{const j=m.job;return(<div key={j.id} className="card hover-card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span className="rank-badge">TOP {i+1}</span><h3 style={{fontSize:16,fontWeight:700,margin:0}}>{j.title}</h3></div><div style={{fontSize:13,color:"#1a73e8",fontWeight:600}}>{j.company}</div></div>
                  <ScoreRing score={m.score} size={52}/>
                </div>
                <div className="meta-row"><span>📍 {j.location}</span><span>💰 {j.salary}</span><span>🎓 {j.education}</span><span>🏭 {j.industry}</span></div>
                <div style={{marginBottom:10}}><div className="sub-label">技术栈 & 技能</div><div className="tag-row">{(j.hard_skills||[]).slice(0,6).map(s=><span key={s} className={`tag ${profile?.skills?.map(x=>x.toLowerCase()).includes(s.toLowerCase())?"success":""}`}>{s}{profile?.skills?.map(x=>x.toLowerCase()).includes(s.toLowerCase())?" ✓":""}</span>)}{(j.soft_skills||[]).map(s=><span key={s} className="tag warn">{s}</span>)}</div></div>
                <div style={{fontSize:13,lineHeight:1.7,marginBottom:8}}><strong>匹配分析：</strong>{m.reason}</div>
                <div style={{display:"flex",gap:16}}><div style={{flex:1}}><div className="sub-label" style={{color:"#2f7d5f"}}>✅ 优势</div>{(m.strengths||[]).map((s,k)=><div key={k} className="hint" style={{fontSize:12}}>• {s}</div>)}</div>
                <div style={{flex:1}}><div className="sub-label" style={{color:"#b3261e"}}>⚠️ 待提升</div>{(m.gaps||[]).map((g,k)=><div key={k} className="hint" style={{fontSize:12}}>• {g}</div>)}</div></div>
              </div>);})}
            </div>}
          </div>}

          {tab==="resume"&&<div className="fade-in" style={{maxWidth:720}}>
            {!resume?<div className="empty-panel"><div style={{fontSize:32}}>📄</div><p>简历尚未生成</p></div>:
            <div><div style={{marginBottom:12}}><button className="toolbar-btn" onClick={()=>{const b=new Blob([resume],{type:"text/html"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="resume.html";a.click();URL.revokeObjectURL(u);}}>导出 HTML</button></div>
            <div className="card" style={{padding:0,overflow:"hidden"}}><iframe srcDoc={resume} style={{width:"100%",height:600,border:"none"}} title="resume"/></div></div>}
          </div>}

          {tab==="gaps"&&<div className="fade-in" style={{maxWidth:720}}>
            {!gaps?<div className="empty-panel"><div style={{fontSize:32}}>📊</div><p>缺口分析尚未完成</p></div>:
            <div className="grid-gap">
              {gaps.overallReadiness&&<div className="card highlight-card"><div style={{fontSize:13,fontWeight:700,marginBottom:6}}>🎯 整体准备度</div><div style={{fontSize:14,lineHeight:1.7}}>{gaps.overallReadiness}</div></div>}
              {(gaps.gaps||[]).map((g,i)=>{const s=sevFn(g.severity);return(<div key={i} className="card hover-card"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontWeight:600,fontSize:14}}>{g.skill}</span><span style={{fontSize:11,padding:"2px 10px",borderRadius:999,background:s.bg,color:s.c,fontWeight:600}}>{s.t}</span></div><p className="hint" style={{marginBottom:6,lineHeight:1.7}}>{g.description}</p>{g.suggestion&&<p style={{fontSize:12,color:"#1a73e8",lineHeight:1.6}}>💡 {g.suggestion}</p>}</div>);})}
              {gaps.keyActions?.length>0&&<div className="card"><h4 style={{fontSize:14,fontWeight:700,marginBottom:10}}>🚀 行动建议</h4>{gaps.keyActions.map((a,i)=><div key={i} style={{fontSize:13,lineHeight:1.8,paddingLeft:20,position:"relative"}}><span style={{position:"absolute",left:0,color:"#1a73e8",fontWeight:700}}>{i+1}.</span>{a}</div>)}</div>}
            </div>}
          </div>}

          {tab==="interview"&&<div className="fade-in" style={{maxWidth:720}}>
            {!qa?.length?<div className="empty-panel"><div style={{fontSize:32}}>🎤</div><p>面试问答尚未生成</p></div>:
            <div className="grid-gap"><div className="hint">共 {qa.length} 道面试题</div>{qa.map((q,i)=><QACard key={i} qa={q} index={i}/>)}</div>}
          </div>}

          {tab==="debug"&&<div className="fade-in" style={{maxWidth:720}}>
            <div className="card"><h4 style={{fontSize:14,fontWeight:700,marginBottom:12}}>🔧 已触发 Agents</h4>
              {agents.length===0?<p className="hint">暂无</p>:agents.map((a,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:i<agents.length-1?"1px solid var(--border)":"none"}}><span style={{width:6,height:6,borderRadius:"50%",background:"#1a73e8"}}/><span style={{fontSize:13,fontWeight:600}}>{a.name}</span><span style={{fontSize:11,color:"var(--text-light)",marginLeft:"auto"}}>{a.time}</span></div>)}
            </div>
            {profile&&<div className="card" style={{marginTop:12}}><h4 style={{fontSize:14,fontWeight:700,marginBottom:8}}>📦 State</h4><pre style={{fontSize:12,background:"#f8fbff",padding:12,borderRadius:8,overflow:"auto",maxHeight:400,lineHeight:1.6}}>{JSON.stringify({profile,matchCount:matches?.length,gapCount:gaps?.gaps?.length,qaCount:qa?.length,hasResume:!!resume},null,2)}</pre></div>}
          </div>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
